# Публикация сайта из папки cite/ на GitHub Pages.
# Запускается при пуше в main, если менялись файлы сайта, или вручную (Actions → Pages → Run workflow).
# Один раз включите: Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cite/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: cite

      - id: deployment
        uses: actions/deploy-pages@v5
