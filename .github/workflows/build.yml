# Сборка «Возврата» под Windows, macOS (Apple Silicon и Intel) и Linux.
# Каждая сборка проходит самопроверку (--smoke) в packaging/build.py.
# Запуск вручную (Actions → Build → Run workflow) — файлы в артефактах;
# пуш тега vX.Y.Z — файлы прикрепляются к релизу.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest      # Apple Silicon
          - os: macos-15-intel    # Intel
          - os: ubuntu-22.04      # старый glibc — сборка запустится и на более новых дистрибутивах
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: Зависимости
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Сборка и самопроверка
        run: python packaging/build.py
        env:
          PYTHONIOENCODING: utf-8
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: vozvrat-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
