# Сборка «Возврата» под Windows, macOS (Apple Silicon и Intel) и Linux.
# Каждая сборка проходит самопроверку (--smoke) в packaging/build.py.
# Запуск вручную (Actions → Build → Run workflow) или pull request — файлы в артефактах;
# пуш тега vX.Y.Z — файлы прикрепляются к релизу.
name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest      # Apple Silicon
          - os: macos-15-intel    # Intel
          - os: ubuntu-22.04      # старый glibc — сборка запустится и на более новых дистрибутивах
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: appimagetool
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          echo "APPIMAGETOOL=$PWD/appimagetool" >> "$GITHUB_ENV"

      - name: Зависимости
        # cryptography — только готовой сборкой: собранная из исходников (так бывает на Intel-маках) берёт
        # внешний OpenSSL и в программе конфликтует с libcrypto из sslpsk_pmd3 — iPhone не находится
        run: python -m pip install --only-binary cryptography -r requirements.txt pyinstaller==6.22.3

      - name: Сборка и самопроверка
        run: python packaging/build.py
        env:
          PYTHONIOENCODING: utf-8
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: vozvrat-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          path: src
      # Номер версии и MIN_VERSION для проверки обновлений в программе: обновление обязательно для версий
      # старее MIN_VERSION (см. app/version.py). Файл берётся по обычной ссылке, без лимита API GitHub
      - name: update.json
        run: |
          python3 - <<'EOF'
          import json, os
          scope = {}
          exec(open("src/app/version.py", encoding="utf-8").read(), scope)
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag.lstrip("v") == scope["VERSION"], f"тег {tag} не совпадает с VERSION {scope['VERSION']}"
          data = {"version": scope["VERSION"], "min_version": scope["MIN_VERSION"]}
          json.dump(data, open("dist/update.json", "w"))
          print(data)
          EOF
      # Контрольные суммы для обновления из самой программы: файл берётся по обычной ссылке
      # на скачивание, у которой нет лимита запросов, как у API GitHub
      - name: SHA256SUMS.txt
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
