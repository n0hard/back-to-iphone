# Автотесты программы (папка tests/). Запускаются при каждом пуше в любую ветку, а сборка (build.yml)
# вызывает их перед сборкой — релиз без прошедших тестов не собирается.
name: Tests

on:
  push:
    branches: ["**"]
  workflow_call:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # тестам нужен только requests: работа с iPhone и окно в них подменяются
      - name: Зависимости
        run: python -m pip install requests==2.34.2

      - name: Тесты
        run: python -m unittest discover -s tests -t tests -v
        env:
          PYTHONIOENCODING: utf-8
